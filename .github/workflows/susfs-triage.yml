name: susfs-triage
run-name: "susfs-triage: ${{ format('build #{0} on {1}', github.event.workflow_run.run_number, github.event.workflow_run.head_branch) }}"

# Collect what is needed to debug a failed build in one artifact: the failed steps, their log
# and the patch and pack rejects. Nothing is checked out or executed from the run, the values
# below are only written to files.
#
# The workflow name below must match .susfs-fork/gen_build.py.
on:
  workflow_run:
    workflows: [build-lkm-susfs]
    types: [completed]

permissions:
  actions: read

jobs:
  triage:
    if: contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Collect the failure
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/triage"
          mkdir -p "$dir"
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[]' > "$dir/jobs.ndjson"
          {
            echo "# Failed build"
            echo
            echo "- run: $RUN_URL"
            echo "- commit: $SHA"
            echo "- branch: $BRANCH"
            echo "- event: $EVENT"
            echo
            echo "## Failed steps"
            echo
            jq -r 'select(.conclusion | IN("failure", "timed_out")) | .name as $job
                   | .steps[] | select(.conclusion | IN("failure", "timed_out", "cancelled"))
                   | "- \($job): \(.name)"' "$dir/jobs.ndjson"
          } > "$dir/summary.md"
          # The rest is best effort, a missing log must not lose the summary.
          gh run view "$RUN_ID" --log-failed > "$dir/failed.log" 2>&1 || true
          gh run download "$RUN_ID" --pattern 'patch-rejects-*' --dir "$dir/patch-rejects" || true
          gh run download "$RUN_ID" --pattern 'pack-rejects' --dir "$dir/pack-rejects" || true

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: triage-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/triage
          retention-days: 14
